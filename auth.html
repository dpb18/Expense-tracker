<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spentify - Google Account Sign-In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: radial-gradient(circle at top right, #1e1b4b 0%, #0a0e1a 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .auth-container {
      background: #111827;
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 20px;
      padding: 36px 30px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6), 0 0 40px rgba(99,102,241,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
      position: relative;
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: #a5b4fc;
    }
    .spinner {
      width: 42px;
      height: 42px;
      border: 3.5px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.3px; }
    p { font-size: 13.5px; color: #94a3b8; margin: 0; line-height: 1.5; }
    
    .btn-google {
      background: #ffffff;
      color: #1f2937;
      border: none;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: all 0.2s;
      width: 100%;
    }
    .btn-google:hover {
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .google-input-form {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
      text-align: left;
      margin-top: 6px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }
    .text-input {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .text-input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    .btn-submit-google {
      background: linear-gradient(135deg, #4285F4 0%, #3b82f6 100%);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 13px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s;
      margin-top: 4px;
    }
    .btn-submit-google:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .status-badge {
      display: none;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid #10b981;
      border-radius: 10px;
      color: #34d399;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
  <script src="lib/firebase-app.js"></script>
  <script src="lib/firebase-auth.js"></script>
  <script src="lib/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="brand-badge">
      <span>💸 Spentify Auth</span>
    </div>

    <div class="spinner" id="spinner"></div>

    <div id="statusBadge" class="status-badge">
      <span>✅</span>
      <span id="statusBadgeText">Successfully Authenticated!</span>
    </div>

    <h2 id="authStatusTitle">Authenticating with Google...</h2>
    <p id="authStatusText">Connecting to Google Accounts to verify your credentials.</p>
    
    <div id="googleFormContainer" style="display: none; width: 100%;">
      <form id="googleDirectAuthForm" class="google-input-form">
        <div class="field-group">
          <label class="field-label" for="googleEmailInput">Your Google / Gmail Account</label>
          <input type="email" id="googleEmailInput" class="text-input" placeholder="e.g. yourname@gmail.com" required autocomplete="email" />
        </div>
        <div class="field-group">
          <label class="field-label" for="googleNameInput">Account Display Name (Optional)</label>
          <input type="text" id="googleNameInput" class="text-input" placeholder="e.g. Your Name" />
        </div>
        <button type="submit" class="btn-submit-google">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="#ffffff" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
            <path fill="#ffffff" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
            <path fill="#ffffff" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1c0 2.8.7 5.4 1.9 7.8l3.7-2.9z"/>
            <path fill="#ffffff" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 6.3 10.1 6.3z"/>
          </svg>
          <span>Authenticate Google Account</span>
        </button>
      </form>
    </div>

    <button type="button" id="manualGoogleBtn" class="btn-google" style="display: none;">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.3H12v4.6h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.9z"/>
        <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.1c0 2.8.7 5.4 1.9 7.8l3.7-2.9z"/>
        <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16c1.8 3.7 5.6 6.3 10.1 6.3z"/>
      </svg>
      <span>Retry Google Sign-In</span>
    </button>
  </div>

  <script src="auth-window.js"></script>
</body>
</html>
